<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUANTS.AT – Digital Intelligence & Analytics</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0208;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Matrix Canvas Background */
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.85;
        }

        /* Scanline Overlay for Retro CRT Effect */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.03),
                rgba(0, 255, 0, 0.01),
                rgba(0, 0, 255, 0.03)
            );
            background-size: 100% 3px, 6px 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Main Glassmorphism Card */
        .content-card {
            position: relative;
            z-index: 3;
            background: rgba(10, 25, 15, 0.8);
            border: 1px solid #00ff66;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.35), inset 0 0 15px rgba(0, 255, 102, 0.15);
            border-radius: 8px;
            padding: 40px 30px;
            max-width: 650px;
            width: 90%;
            text-align: center;
            backdrop-filter: blur(5px);
        }

        .terminal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px dashed rgba(0, 255, 102, 0.4);
            padding-bottom: 10px;
            margin-bottom: 25px;
            font-size: 0.85rem;
            color: #00cc52;
            letter-spacing: 1px;
        }

        .dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #00ff66;
            box-shadow: 0 0 8px #00ff66;
        }

        /* Title Styling */
        h1 {
            font-size: 3rem;
            letter-spacing: 6px;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66;
            color: #ffffff;
        }

        h1 span {
            color: #00ff66;
        }

        /* Tagline / Terminal Text */
        .tagline {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #a3ffc2;
            margin-bottom: 30px;
            min-height: 3.2em;
            text-shadow: 0 0 5px rgba(0, 255, 102, 0.5);
        }

        .cursor {
            display: inline-block;
            width: 10px;
            background-color: #00ff66;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* CTA Button */
        .matrix-btn {
            display: inline-block;
            background: transparent;
            color: #00ff66;
            border: 2px solid #00ff66;
            padding: 14px 32px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 2px;
            text-decoration: none;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
            cursor: pointer;
        }

        .matrix-btn:hover {
            background: #00ff66;
            color: #0d0208;
            box-shadow: 0 0 25px rgba(0, 255, 102, 0.8);
        }

        .footer-status {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #00993d;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            h1 { font-size: 2.2rem; letter-spacing: 3px; }
            .tagline { font-size: 0.95rem; }
            .content-card { padding: 25px 20px; }
        }
    </style>
</head>
<body>

    <!-- Canvas für den digitalen Regen -->
    <canvas id="matrix-canvas"></canvas>
    
    <!-- CRT-Monitor Scanline Effect -->
    <div class="overlay"></div>

    <!-- Content Box -->
    <div class="content-card">
        <div class="terminal-header">
            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            <div>SYS_STATUS: ONLINE</div>
        </div>

        <h1>QUANTS<span>.AT</span></h1>

        <p class="tagline">
            <span id="typed-text"></span><span class="cursor">&nbsp;</span>
        </p>

        <a href="mailto:office@quants.at" class="matrix-btn">[ INITIALIZE_CONTACT ]</a>

        <div class="footer-status">
            LOC: AT_NODE_01 // SECURE_CONNECTION
        </div>
    </div>

    <script>
        // Matrix Rain Setup
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const baseChars = '012345678901234567890123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
        const fontSize = 16;
        let columns = Math.floor(canvas.width / fontSize);
        let drops = Array(columns).fill(1);

        function getRandomChar() {
            // Mit einer bestimmten Wahrscheinlichkeit die Buchstaben Q, U, A, N, T einstreuen
            const quantLetters = ['Q', 'U', 'A', 'N', 'T'];
            if (Math.random() < 0.18) {
                return quantLetters[Math.floor(Math.random() * quantLetters.length)];
            }
            return baseChars[Math.floor(Math.random() * baseChars.length)];
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(13, 2, 8, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < drops.length; i++) {
                const char = getRandomChar();
                const x = i * fontSize;
                const y = drops[i] * fontSize;

                // Versteckter Clou: 'QUANT'-Buchstaben leuchten hellweiß heraus
                if (['Q', 'U', 'A', 'N', 'T'].includes(char) && Math.random() < 0.35) {
                    ctx.fillStyle = '#ffffff'; // Weißes Leuchten
                    ctx.shadowColor = '#00ff66';
                    ctx.shadowBlur = 12;
                } else {
                    ctx.fillStyle = '#00ff66'; // Standard Matrix Grün
                    ctx.shadowBlur = 0;
                }

                ctx.fillText(char, x, y);

                if (y > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }

        setInterval(drawMatrix, 100);

        // Typewriter Effect
        const textToType = "Entering data stream... Decoding macroeconomic signals, financial models, and quantitative insights for Austria.";
        let textIndex = 0;
        const typedTextElement = document.getElementById('typed-text');

        function typeWriter() {
            if (textIndex < textToType.length) {
                typedTextElement.innerHTML += textToType.charAt(textIndex);
                textIndex++;
                setTimeout(typeWriter, 35);
            }
        }

        setTimeout(typeWriter, 500);
    </script>
</body>
</html>
